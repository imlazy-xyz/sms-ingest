<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}SMS Ingest — Admin Reader{% endblock %}</title>
<script src="/static/htmx.min.js"></script>
<link rel="stylesheet" href="/static/reader.css">
</head>
<body>
<header>
  <a href="/users">SMS Ingest</a>
  <nav>
    <a href="/users">Users</a>
    <a href="/devices">Devices</a>
    <a href="/unassigned">Unassigned</a>
  </nav>
  <div class="jump-search">
    <input
      type="search"
      name="q"
      placeholder="Jump to user or number…"
      autocomplete="off"
      hx-get="/search"
      hx-trigger="input changed delay:300ms, search"
      hx-target="#jump-search-results"
      hx-indicator="#jump-search-spinner"
      hx-swap="innerHTML">
    <span id="jump-search-spinner" class="spinner htmx-indicator"></span>
    <div id="jump-search-results" class="jump-search-results"></div>
  </div>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
