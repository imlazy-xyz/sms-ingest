name: Android Release Build

# Manual only: signs a release APK using repo secrets
# (RELEASE_KEYSTORE_BASE64/RELEASE_KEYSTORE_PASSWORD/RELEASE_KEY_ALIAS/
# RELEASE_KEY_PASSWORD) and uploads it as a downloadable artifact. Kept
# separate from android-ci.yml so pull_request runs (including from forks)
# never have secrets in scope.
on:
  workflow_dispatch: {}

permissions:
  contents: read

defaults:
  run:
    working-directory: android

jobs:
  build-release:
    name: Build signed release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Write release keystore and properties
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          cat > keystore.properties <<EOF
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Assemble release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Remove keystore and properties
        if: always()
        run: rm -f release.jks keystore.properties

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: sms-ingest-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
