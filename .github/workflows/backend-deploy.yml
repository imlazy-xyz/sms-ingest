name: Backend Deploy

# Manual only: builds the backend image, pushes a SHA-tagged copy to Artifact
# Registry, and deploys it to Cloud Run by resolved digest. Kept off
# push/pull_request (like android-release.yml) so deploy credentials are
# never in scope for automatic or fork-triggered runs.
#
# Auth is keyless: Workload Identity Federation lets this workflow impersonate
# the "sms-ingest-backend-deployer" SA without a stored key (Terraform-managed
# in the private sms-ingest-infra repo, github_deploy.tf). Requires two repo
# variables set once, from that Terraform's outputs:
#   GCP_WORKLOAD_IDENTITY_PROVIDER  (output: backend_deployer_wif_provider)
#   GCP_DEPLOYER_SA                 (output: backend_deployer_sa_email)
#
# Terraform owns the Cloud Run service's env/secrets/scaling and ignores the
# image field on purpose (decisions.md 2026-07-19) — this workflow only ever
# changes the running image, matching infra/README.md's documented steps.
on:
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

env:
  REGION: us-central1
  PROJECT_ID: sms-ingest-prod-215804
  SERVICE: sms-ingest-backend
  REPOSITORY: sms-ingest

defaults:
  run:
    working-directory: backend

jobs:
  build-push-deploy:
    name: Build, push, and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      # Pin the quota/billing project: WIF (external_account) credentials carry
      # none, so gcloud API calls (the Cloud Run update below) can fail the
      # serviceusage.services.use check without it, even with the IAM role
      # granted.
      - name: Pin gcloud quota project
        run: gcloud config set billing/quota_project "${PROJECT_ID}"

      # Build and push directly with Docker rather than `gcloud builds submit`.
      # Cloud Build stages the source in an auto-created GCS bucket
      # (${PROJECT_ID}_cloudbuild); under WIF the staging upload consistently
      # fails a serviceusage.services.use/bucket-access check that neither
      # roles/serviceusage.serviceUsageConsumer, roles/storage.admin on the
      # bucket, nor an explicit quota project resolved. The deployer SA already
      # holds roles/artifactregistry.writer (sms-ingest-infra github_deploy.tf),
      # so pushing straight to Artifact Registry needs no extra IAM and drops
      # the Cloud Build dependency entirely. Digest comes from the push (via
      # docker inspect) so no gcloud Artifact Registry API call is needed.
      - name: Build and push SHA-tagged image
        id: image
        run: |
          set -euo pipefail
          SHA="$(git rev-parse --short HEAD)"
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/backend"
          docker build --tag "${IMAGE}:${SHA}" .
          docker push "${IMAGE}:${SHA}"
          REF="$(docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE}:${SHA}")"
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloud Run
        run: |
          gcloud run services update "${SERVICE}" \
            --region "${REGION}" \
            --image "${{ steps.image.outputs.ref }}"
