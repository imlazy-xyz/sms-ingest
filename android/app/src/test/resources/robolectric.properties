# Pins Robolectric's simulated SDK to this project's locked
# minSdk=targetSdk=compileSdk=35 (Android 15 only — decisions.md 2026-07-21).
# Without this, Robolectric defaults to the manifest's targetSdk, which is
# already 35 here, but pinning it explicitly avoids silently drifting if the
# manifest ever changes without a matching decision.
sdk=35
